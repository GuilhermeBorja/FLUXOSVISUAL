name: Validate PRD4
on:
  push:
    branches: [PRD4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Regression tests
        run: npm test
      - name: Browser tests
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          nohup python3 -m http.server 8080 --directory dist > /tmp/fluxosvisual-prd4-http.log 2>&1 &
          timeout 20 bash -c 'until curl -fsS http://127.0.0.1:8080 >/dev/null; do sleep 1; done'
          node browser-tests/prd3-smoke.mjs
