name: Deploy FLUXOSVISUAL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chronos-fluxosvisual
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Atualizar codigo preservando .env e override
        working-directory: /opt/fluxosvisual/FluxosVisual_PRD6
        run: |
          git config --global --add safe.directory /opt/fluxosvisual/FluxosVisual_PRD6
          git fetch origin
          git checkout main
          git reset --hard origin/main
          test -f .env
          test -f compose.override.yaml

      - name: Backup antes do deploy
        working-directory: /opt/fluxosvisual/FluxosVisual_PRD6
        run: |
          docker compose exec -T fluxosvisual node scripts/backup.mjs || true

      - name: Recriar container com nova imagem
        working-directory: /opt/fluxosvisual/FluxosVisual_PRD6
        run: |
          docker compose up -d --build --force-recreate

      - name: Validar saude da aplicacao
        working-directory: /opt/fluxosvisual/FluxosVisual_PRD6
        run: |
          sleep 5
          docker compose ps
          curl -fsS http://127.0.0.1:3000/api/health > /dev/null
