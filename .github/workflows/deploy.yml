name: Deploy FLUXOSVISUAL
on:
  push:
    branches: [PRD5]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/PRD5'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PRD5
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Check project
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Install browser test runner
        run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: |
          nohup python3 -m http.server 8080 --directory dist > /tmp/fluxosvisual-http.log 2>&1 &
          timeout 20 bash -c 'until curl -fsS http://127.0.0.1:8080 >/dev/null; do sleep 1; done'
          node browser-tests/prd5-smoke.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      # PRD5 usa um ambiente especifico para nao conflitar com a restricao de branch do antigo github-pages.
      # A publicacao continua usando o mesmo site GitHub Pages do repositorio.
      name: prd5-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy PRD5 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published version
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "${SITE_URL}version.js?verify=${EXPECTED_BUILD}-${attempt}" | grep -F "${EXPECTED_BUILD:0:7}"; then
              echo "Published PRD5 commit ${EXPECTED_BUILD} at ${SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'Pages deployment completed, but the published build could not be verified.' >&2
          exit 1
