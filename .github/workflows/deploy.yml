name: Deploy PRD4.3 FLUXOSVISUAL
on:
  push:
    branches: [PRD3]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/PRD3'
    outputs:
      deployed_sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PRD4.3 for Pages
        uses: actions/checkout@v4
        with:
          ref: PRD4.3
      - name: Record deployed PRD4.3 commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build project
        # GitHub runner reserves GITHUB_SHA / GITHUB_REF_NAME even when a
        # different branch is checked out; read the actual checked-out git commit.
        run: env -u GITHUB_SHA -u GITHUB_REF_NAME npm run build
      - name: Check project
        run: npm run check
      - name: Run regression tests
        run: npm test
      - name: Check UX, domain and Gantt integration contracts
        run: node --test tests/prd41.test.mjs tests/prd42.test.mjs tests/prd43.test.mjs
      - name: Install browser test runner
        run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Run PRD4.3 browser journeys
        run: |
          nohup python3 -m http.server 8080 --directory dist > /tmp/fluxosvisual-http.log 2>&1 &
          timeout 20 bash -c 'until curl -fsS http://127.0.0.1:8080 >/dev/null; do sleep 1; done'
          node browser-tests/prd43-smoke.mjs
          node browser-tests/prd43-responsive.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy PRD4.3 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published version
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD: ${{ needs.build.outputs.deployed_sha }}
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "${SITE_URL}version.js?verify=${EXPECTED_BUILD}-${attempt}" | grep -F "${EXPECTED_BUILD:0:7}"; then
              echo "Published PRD4.3 commit ${EXPECTED_BUILD} at ${SITE_URL}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'Pages deployment completed, but the published build could not be verified.' >&2
          exit 1
