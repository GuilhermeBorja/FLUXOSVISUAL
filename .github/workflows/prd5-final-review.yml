name: PRD5 Final Review Validation
on:
  push:
    branches: [PRD5-REVISAO-FINAL, PRD5-FRONTEND-FINAL-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: |
          nohup python3 -m http.server 8080 --directory dist >/tmp/prd5-review.log 2>&1 &
          timeout 20 bash -c 'until curl -fsS http://127.0.0.1:8080 >/dev/null; do sleep 1; done'
          node browser-tests/prd5-smoke.mjs
          node browser-tests/prd5-full-acceptance.mjs
          node browser-tests/prd5-hardening.mjs
