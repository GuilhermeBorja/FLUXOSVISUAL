name: Diagnose Pages deployment restriction
on:
  push:
    branches: [fix/prd3-inclusive-calendar-20261019]
permissions:
  contents: read
  checks: read
  deployments: read
  pages: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Read failed deployment annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/check-runs/118047510491/annotations" --jq '.[] | {title, message, annotation_level}'
      - name: Read Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{html_url,build_type,source,status}'
      - name: Read environment deployment policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/environments/github-pages" --jq '{name,deployment_branch_policy,protection_rules}'
