name: Verify inclusive calendar correction
on:
  push:
    branches: [fix/prd3-inclusive-calendar-20261019]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prd3-inclusive-calendar-20261019
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source correction
        run: node scripts/apply-calendar-fix.mjs && node scripts/calendar-regression-update.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build and syntax check
        run: npm run build && npm run check
      - name: Inclusive calendar acceptance tests
        run: node --test tests/inclusive-calendar.test.mjs
      - name: Full regression suite
        run: npm test
      - name: Install browser runner
        run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Browser regression
        run: |
          nohup python3 -m http.server 8080 --directory dist > /tmp/fluxosvisual-http.log 2>&1 &
          timeout 20 bash -c 'until curl -fsS http://127.0.0.1:8080 >/dev/null; do sleep 1; done'
          node browser-tests/prd3-smoke.mjs
      - name: Commit verified source, not generated build metadata
        run: |
          git restore dist/index.html dist/vendor.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.js dist/workspace.js package.json package-lock.json README.md tests
          git commit -m 'fix: inclusive calendar dates, consistent CPM and bulk durations'
          git push origin HEAD:fix/prd3-inclusive-calendar-20261019
      - name: Show source diff on failure
        if: failure()
        run: git diff --stat
