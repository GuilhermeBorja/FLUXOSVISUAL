services:
  fluxosvisual:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /var/lib/fluxosvisual
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      TZ: ${TZ:-America/Sao_Paulo}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      ATTACHMENT_QUOTA_BYTES: ${ATTACHMENT_QUOTA_BYTES:-1073741824}
      REQUIRE_ATTACHMENT_SCAN: ${REQUIRE_ATTACHMENT_SCAN:-false}
      ATTACHMENT_SCAN_COMMAND: ${ATTACHMENT_SCAN_COMMAND:-}
    volumes:
      - fluxosvisual_data:/var/lib/fluxosvisual
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  fluxosvisual_data:
